name: kit_app
description: "Kit App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: 9.2.1
  cached_network_image: 3.4.1
  clock: 1.1.2
  connectivity_plus: 6.1.5
  dartz: 0.10.1
  # 5.10 or later: the error handler reads DioExceptionType.transformTimeout.
  dio: 5.11.1
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  flutter_cache_manager: 3.4.1
  flutter_local_notifications: 21.0.0
  flutter_secure_storage: 9.2.4
  get_it: 9.3.0
  go_router: 18.1.4
  image_picker: 1.2.1
  intl: 0.20.2
  permission_handler: 12.0.1
  # Exact pins, and pubspec.lock pins the rest: the kit is proven against
  # these versions. core/platform is written against these plugin APIs
  # (SharePlus.instance, the named parameters of flutter_local_notifications
  # 21, permission_handler's PermissionStatus). Bump one deliberately, with
  # `flutter pub upgrade <package>` and a green tool/verify.sh.
  share_plus: 12.0.2
  shared_preferences: 2.5.5
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: 10.0.0
  fake_async: 1.3.3
  mocktail: 1.0.5
  very_good_analysis: 10.3.0
  yaml: 3.1.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    # A neutral placeholder mark. Replace it with your own logo, same path.
    - assets/images/logo.png
